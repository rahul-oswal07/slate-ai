# Local development. T-04 adds the app service.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: slateai
      POSTGRES_PASSWORD: slateai
      POSTGRES_DB: slateai
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slateai -d slateai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
