# Local development.
#   DB only:        docker compose -f deploy/docker-compose.yml up -d db
#   Full container: docker compose -f deploy/docker-compose.yml up --build   → http://localhost:8080
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: slateai
      POSTGRES_PASSWORD: slateai
      POSTGRES_DB: slateai
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slateai -d slateai"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      ConnectionStrings__Db: Host=db;Port=5432;Database=slateai;Username=slateai;Password=slateai
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
