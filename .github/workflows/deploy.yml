name: deploy

# main (after ci passes) → staging · tags v* → production. Auth to Azure is OIDC (no stored secrets);
# IDs and app names are repo variables set by deploy/azure/provision.sh.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy-${{ github.event_name == 'push' && 'production' || 'staging' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: meta
        run: |
          echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = push ]; then echo "channel=${GITHUB_REF_NAME}"; else echo "channel=main"; fi >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.channel }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'staging' }}
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ github.event_name == 'push' && vars.AZURE_WEBAPP_PROD || vars.AZURE_WEBAPP_STAGING }}
          images: ${{ env.IMAGE }}:${{ needs.image.outputs.tag }}

      - name: Smoke test (waits for the new build to be serving)
        env:
          URL: ${{ steps.deploy.outputs.webapp-url }}
          EXPECTED: ${{ needs.image.outputs.tag }}
        run: |
          # App Service swaps containers in the background: wait until /health reports the new
          # build on 3 consecutive polls, so we never pass against the old container or a swap blip.
          ok=0; seen=none
          for i in $(seq 1 90); do
            seen=$(curl -s --max-time 10 "$URL/health" | jq -r '.version // empty' 2>/dev/null || true)
            if [ "$seen" = "$EXPECTED" ]; then ok=$((ok + 1)); else ok=0; fi
            [ "$ok" -ge 3 ] && break
            sleep 5
          done
          if [ "$ok" -lt 3 ]; then
            echo "::error::$URL never served $EXPECTED (last seen: ${seen:-none})"; exit 1
          fi
          echo "serving $EXPECTED"
          curl -sf --retry 3 --retry-all-errors "$URL/" | grep -q '<html lang="kn">'
          test "$(curl -s --retry 3 -o /dev/null -w '%{http_code}' "$URL/api/does-not-exist")" = "404"
