name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        if: hashFiles('SlateAi.sln') != ''
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        if: hashFiles('src/web/package.json') != ''
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Verify (build + unit + integration + web tests)
        run: ./scripts/verify.sh
        env:
          Ai__Provider: Fake

      - name: Install Playwright browsers
        if: hashFiles('src/web/playwright.config.ts') != ''
        working-directory: src/web
        run: npx playwright install --with-deps chromium

      - name: End-to-end + accessibility
        if: hashFiles('src/web/playwright.config.ts') != ''
        working-directory: src/web
        run: npx playwright test
        env:
          Ai__Provider: Fake

      - uses: actions/upload-artifact@v4
        if: failure() && hashFiles('src/web/playwright-report/**') != ''
        with:
          name: playwright-report
          path: src/web/playwright-report

  container:
    # Builds the production image and checks it boots against Postgres and serves the SPA.
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: slateai
          POSTGRES_PASSWORD: slateai
          POSTGRES_DB: slateai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slateai -d slateai"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f deploy/Dockerfile --build-arg APP_VERSION=ci-${GITHUB_SHA::7} -t slate-ai:ci .

      - name: Run and smoke-test
        run: |
          docker run -d --name app --network host \
            -e ConnectionStrings__Db="Host=localhost;Port=5432;Database=slateai;Username=slateai;Password=slateai" \
            -e ASPNETCORE_HTTP_PORTS=8080 slate-ai:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && break; sleep 2; done
          curl -sf http://localhost:8080/health
          test "$(curl -s http://localhost:8080/health | jq -r .version)" = "ci-${GITHUB_SHA::7}"
          curl -sf http://localhost:8080/ | grep -q '<html lang="kn">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/does-not-exist)" = "404"

      - name: Container logs
        if: always()
        run: docker logs app || true
